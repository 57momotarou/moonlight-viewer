<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b1220">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Moonlight">
  <title>Moonlight Viewer</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div id="startupSplash" class="startup-splash" aria-live="polite" role="status">
    <div class="startup-card">
      <img src="./icons/icon-192.png" alt="Moonlight" class="startup-logo">
      <h1>Moonlight</h1>
      <p id="startupText">起動しています…</p>
      <div class="startup-progress"><i id="startupProgressBar"></i></div>
    </div>
  </div>

  <div id="app">
    <section id="loginScreen" class="login-screen hidden">
      <div class="login-card">
        <img src="./icons/icon-192.png" alt="Moonlight" class="login-logo">
        <h1>Moonlight</h1>
        <p class="muted">閲覧専用</p>

        <div id="connectionSetup" class="setup-box hidden">
          <h2>Supabase接続設定</h2>
          <label>Supabase URL
            <input id="setupUrl" type="url" autocomplete="url" placeholder="https://xxxxx.supabase.co">
          </label>
          <label>Publishable key
            <textarea id="setupKey" rows="3" spellcheck="false" placeholder="sb_publishable_..."></textarea>
          </label>
          <button id="saveConnectionBtn" type="button" class="secondary">接続設定を保存</button>
          <p class="tiny muted">Secret key / service_role は入力しないでください。</p>
        </div>

        <form id="loginForm">
          <label>viewerメールアドレス
            <input id="emailInput" type="email" autocomplete="username" required>
          </label>
          <label>パスワード
            <input id="passwordInput" type="password" autocomplete="current-password" required>
          </label>
          <button type="submit" class="primary">ログイン</button>
        </form>
        <button id="toggleSetupBtn" type="button" class="link-btn">接続設定</button>
        <p id="loginStatus" class="status" aria-live="polite"></p>
      </div>
    </section>

    <section id="viewerScreen" class="viewer hidden">
      <header class="topbar">
        <div class="brand">
          <img src="./icons/icon-192.png" alt="">
          <div>
            <strong>Moonlight</strong>
            <span>cafe＆bar・閲覧専用</span>
          </div>
        </div>
        <div class="top-actions">
          <button id="refreshBtn" type="button" class="icon-btn" aria-label="更新">↻</button>
          <button id="logoutBtn" type="button" class="text-btn">ログアウト</button>
        </div>
      </header>

      <main id="content" class="content">
        <section class="page active" data-page="overview">
          <div class="page-head">
            <div>
              <h1>概要</h1>
              <p id="cloudMeta" class="muted"></p>
            </div>
          </div>
          <button id="overviewCards" class="overview-summary-card" type="button" aria-expanded="false"></button>
          <div id="overviewExtraDetails" class="overview-extra-details hidden"></div>

          <div class="section overview-achievements-section">
            <div class="section-title"><h2>在籍者</h2><span id="overviewActiveCount" class="overview-group-count">0人</span></div>
            <div id="overviewAchievements" class="overview-employee-list"></div>
          </div>
          <div class="section overview-achievements-section overview-retired-section">
            <div class="section-title"><h2>退職者</h2><span id="overviewRetiredCount" class="overview-group-count">0人</span></div>
            <div id="overviewRetiredAchievements" class="overview-employee-list"></div>
          </div>
        </section>

        <section class="page" data-page="sales">
          <div class="page-head"><h1>販売実績</h1></div>
          <div class="segmented sales-view-tabs">
            <button type="button" class="seg active" data-sales-tab="store">店頭販売</button>
            <button type="button" class="seg" data-sales-tab="summary">集計</button>
            <button type="button" class="seg" data-sales-tab="delivery">デリバリー</button>
          </div>
          <div id="storeSalesPanel">
            <div id="salesList" class="card-list"></div>
          </div>
          <div id="salesSummaryPanel" class="hidden">
            <label class="sales-summary-mode">
              <span>集計単位</span>
              <select id="salesSummaryMode">
                <option value="day">日別</option>
                <option value="employee">従業員別</option>
                <option value="dayEmployee">日別 × 従業員別</option>
              </select>
            </label>
            <div id="salesSummaryTotals" class="stat-grid sales-summary-totals"></div>
            <div id="salesSummaryList" class="card-list sales-summary-list"></div>
          </div>
          <div id="deliverySalesPanel" class="hidden">
            <div id="deliveryList" class="card-list"></div>
          </div>
        </section>

        <section class="page" data-page="buyers">
          <div class="page-head"><h1>購入者</h1></div>
          <div id="buyersList" class="card-list"></div>
        </section>

        <section class="page" data-page="products">
          <div class="page-head"><h1>商品管理</h1></div>
          <div id="productsList" class="product-grid"></div>
        </section>

        <section class="page" data-page="inventory">
          <div class="page-head"><h1>在庫管理</h1></div>
          <div id="inventoryLatest"></div>
          <div class="section">
            <div class="section-title"><h2>履歴</h2></div>
            <div id="inventoryHistory" class="card-list"></div>
          </div>
        </section>

        <section class="page" data-page="bonus">
          <div class="page-head"><h1>ボーナス</h1></div>
          <div id="bonusSummary" class="stat-grid"></div>
          <div class="section">
            <div class="section-title"><h2>今回のボーナス</h2></div>
            <div id="bonusCurrent" class="card-list"></div>
          </div>
          <div class="section">
            <div class="section-title"><h2>支給履歴</h2></div>
            <div id="payoutHistory" class="card-list"></div>
          </div>
        </section>

        <section class="page" data-page="employees">
          <div class="page-head"><h1>従業員名簿</h1></div>
          <div id="employeeList" class="card-list"></div>
        </section>
      </main>

      <nav class="bottom-nav" aria-label="メインメニュー">
        <button type="button" class="nav-btn active" data-page-target="overview"><span>⌂</span><small>概要</small></button>
        <button type="button" class="nav-btn" data-page-target="sales"><span>▤</span><small>販売実績</small></button>
        <button type="button" class="nav-btn" data-page-target="buyers"><span>◎</span><small>購入者</small></button>
        <button type="button" class="nav-btn" data-page-target="products"><span>◇</span><small>商品</small></button>
        <button type="button" class="nav-btn" data-page-target="more"><span>•••</span><small>その他</small></button>
      </nav>

      <div id="moreSheet" class="sheet hidden" aria-hidden="true">
        <button type="button" data-more-target="inventory">在庫管理</button>
        <button type="button" data-more-target="bonus">ボーナス</button>
        <button type="button" data-more-target="employees">従業員名簿</button>
        <button type="button" id="closeMoreBtn">閉じる</button>
      </div>

      <div id="salesDetailModal" class="employee-detail-modal hidden" aria-hidden="true">
        <div class="employee-detail-backdrop" data-close-sales-detail></div>
        <section class="employee-detail-sheet" role="dialog" aria-modal="true" aria-labelledby="salesDetailTitle">
          <div class="employee-detail-sheet-head">
            <div><span class="muted tiny">SALES DETAIL</span><h2 id="salesDetailTitle">伝票詳細</h2></div>
            <button id="closeSalesDetailBtn" type="button" class="icon-btn" aria-label="閉じる">×</button>
          </div>
          <div id="salesDetailContent" class="employee-detail-content"></div>
        </section>
      </div>

      <div id="buyerDetailModal" class="employee-detail-modal hidden" aria-hidden="true">
        <div class="employee-detail-backdrop" data-close-buyer-detail></div>
        <section class="employee-detail-sheet" role="dialog" aria-modal="true" aria-labelledby="buyerDetailTitle">
          <div class="employee-detail-sheet-head">
            <div><span class="muted tiny">BUYER DETAIL</span><h2 id="buyerDetailTitle">購入者詳細</h2></div>
            <button id="closeBuyerDetailBtn" type="button" class="icon-btn" aria-label="閉じる">×</button>
          </div>
          <div id="buyerDetailContent" class="employee-detail-content"></div>
        </section>
      </div>

      <div id="employeeDetailModal" class="employee-detail-modal hidden" aria-hidden="true">
        <div class="employee-detail-backdrop" data-close-employee-detail></div>
        <section class="employee-detail-sheet" role="dialog" aria-modal="true" aria-labelledby="employeeDetailTitle">
          <div class="employee-detail-sheet-head">
            <div><span class="muted tiny">EMPLOYEE DETAIL</span><h2 id="employeeDetailTitle">従業員詳細</h2></div>
            <button id="closeEmployeeDetailBtn" type="button" class="icon-btn" aria-label="閉じる">×</button>
          </div>
          <div id="employeeDetailContent" class="employee-detail-content"></div>
        </section>
      </div>

      <div id="loadingOverlay" class="loading-overlay hidden">
        <div class="spinner"></div>
        <span>読み込み中…</span>
      </div>
      <div id="toast" class="toast hidden" aria-live="polite"></div>
    </section>
  </div>

  <script src="./config.js"></script>
  <script src="./app.js"></script>
</body>
</html>
